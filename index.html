<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Login UI</title>
<link rel="stylesheet" href="style.css">
<style>
@import url('https://fonts.googleapis.com/css?family=Montserrat:400,800');

*{
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, 
  #667eea, 
  #33263f);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Montserrat',sans-serif;
}

.container {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 30px 30px 
  rgba(0,0,0,0.2);
  position: relative;
  width: 500px;
  max-width: 100%;
  min-height: 480px;
  overflow: hidden;
}

.form-container {
  position: absolute;
  top: 0;
  height: 100%;
  width: 50%;
  transition: all 0.6s 
  ease-in-out;
}

form {
  background: #fff;
  display: flex;
  flex-direction: column;
  padding: 0 50px;
  height: 100%;
  justify-content: center;
  text-align: center;
}

input {
  background: #f2f2f2;
  border: none;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

button {
  border-radius: 20px;
  border: none;
  background: #667eea;
  color: #fff;
  padding: 12px;
  margin-top: 10px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

a {
  color: #333;
  font-size: 12px;
  margin: 10px 0;
}

.sign-in-container {
  left: 0;
  z-index: 2;
}

.sign-up-container {
  left: 0;
  opacity: 0;
  z-index: 1;
}

.overlay-container {
  position: absolute;
  top: 0;
  left: 50%;
  width: 50%;
  height: 100%;
  overflow: hidden;
  transition: 
  transform 0.6s 
  ease-in-out;
  z-index: 100;
}

.overlay {
  background: linear-gradient(135deg,
  #667eea,
  #5c1e9a);
  color: white;
  position: relative;
  left: -100%;
  height: 100%;
  width: 200%;
  transform: translateX(0);
  transition: 
  transform 0.6s 
  ease-in-out;
}

.overlay-panel {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  height: 100%;
  width: 50%;
  padding: 0 40px;
}

.overlay-right {
  right: 0;
}

.ghost {
  background: transparent;
  border: 2px solid #fff;
}

.container.right-panel-active 
.sign-in-container {
  transform: translateX(100%);
}

.container.right-panel-active 
.sign-up-container {
  transform: translateX(100%);
  opacity: 1;
  z-index: 5;
}

.container.right-panel-active 
.overlay-container {
  transform: translateX(-100%);
}

.container.right-panel-active 
.overlay {
  transform: translateX(50%);
}

</style>
</head>

<body>
<div class="container" id="container">
<div class="form-containser sign-up-container">
<form>
<h1>Create Account</h1>
<input type="text" placeholder="Name" />
<input type="email" placeholder="Email" />
<input type="password" placeholder="Password" />
<button>Sign Up</button>
</form>
</div>

<div class="form-container sign-in-container">
<form>
<h1>Sign In</h1>
<input type="email" placeholder="Email" />
<input type="password" placeholder="Password" />
<a href="#">Forgot your password?</a>
<button>Sign In</button>
</form>
</div>

<div class="overlay-container">
<div class="overlay">
<div class="overlay-panel overlay-left">
<h1>Welcome Back!</h1>
<p>Login to continue your journey</p>
<button class="ghost" id="signIn">Sign In</button>
</div>

<div class="overlay-panel overlay-right">
<h1>Hello, Friend!</h1>
<p>Enter your details and start your journey</p>
<button class="ghost" id="signUp">Sign Up</button>
</div>
</div>
</div>
</div>

<script>
const container = document.getElementById("container");
document.getElementById("signUp").addEventListener("click",()=>{
container.classList.add("right-panel-active");
});
document.getElementById("signIn").addEventListener("click",()=>{
container.classList.remove("right-panel-active");
});
</script>
</body>
</html>
